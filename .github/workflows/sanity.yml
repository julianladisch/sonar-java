name: sanity
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - run: mvn -B clean install -P sanity
